# CI (docs/analise-arquitetural-ci.md) - roda a suíte de testes de
# backend e frontend automaticamente a cada push/PR, GRATUITO (GitHub
# Actions inclui minutos gratuitos de sobra para um repositório público
# deste tamanho). Não faz deploy nem publica nada - só valida que a
# suíte inteira continua passando antes de qualquer merge, complementando
# (não substituindo) o deploy manual descrito em
# docs/analise-arquitetural-deploy-prealfa.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # mesma versão declarada em render.yaml (PYTHON_VERSION) - CI
          # valida contra o mesmo runtime usado em produção.
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar suíte de testes
        # SECRET_KEY não tem valor padrão em app/core/config.py de propósito
        # (nunca existe um segredo hardcoded/inseguro) - aqui é só uma
        # string qualquer, suficiente para os testes assinarem/validarem
        # JWT em memória; nunca é o segredo real de produção (esse vive só
        # como variável de ambiente no dashboard do Render).
        env:
          SECRET_KEY: chave-de-teste-usada-somente-no-ci
        run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos + suíte de testes
        run: |
          npx tsc -b
          npm test

      - name: Build de produção
        # VITE_API_URL real só é preenchida no ambiente do Render (ver
        # render.yaml) - aqui é só um valor qualquer para o build não
        # falhar por variável ausente; nunca é publicado nem usado de
        # verdade (este job não faz deploy).
        env:
          VITE_API_URL: https://ci-build-nao-publicado.invalid
        run: npm run build
